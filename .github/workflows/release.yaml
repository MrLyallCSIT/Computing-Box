name: Changelog + Release on main

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop if this is the bot changelog/version commit
        shell: bash
        run: |
          set -e
          msg="$(git log -1 --pretty=%B)"
          echo "$msg" | tr -d '\r' | grep -qi "\[skip ci\]" && {
            echo "Skipping (bot commit with [skip ci])"
            exit 0
          } || true

      - name: Install git-cliff
        shell: bash
        run: |
          set -e
          GIT_CLIFF_VERSION="2.11.0"
          URL="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -L "$URL" -o /tmp/git-cliff.tar.gz
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install /tmp/git-cliff-*/git-cliff /usr/local/bin/git-cliff
          git-cliff --version

      - name: Prepare YY.MM.DD letter-suffix tag + release name
        shell: bash
        run: |
          set -e

          VERSION="$(date -u +'%y.%m.%d')"
          PREFIX="v${VERSION}."

          last_letter="$(
            git tag --list "${PREFIX}[a-z]" \
              | sed -E "s/^${PREFIX}([a-z])$/\1/" \
              | sort \
              | tail -n 1
          )"

          if [ -z "$last_letter" ]; then
            next_letter="a"
          else
            if [ "$last_letter" = "z" ]; then
              echo "❌ Already have v${VERSION}.z today. Refusing to create more than 26 releases/day."
              exit 1
            fi
            next_letter="$(printf "%b" "$(printf '\\%03o' "$(( $(printf '%d' "'$last_letter") + 1 ))")")"
          fi

          TAG="${PREFIX}${next_letter}"
          RELEASE_NAME="Computing:Box v${VERSION}.${next_letter}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=Computing:Box Website.zip" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"

          echo "Using tag: $TAG"
          echo "Release name: $RELEASE_NAME"
          echo "Release URL: $RELEASE_URL"

      - name: Find previous release tag
        shell: bash
        run: |
          set -e

          PREV_TAG="$(
            git for-each-ref \
              --sort=-creatordate \
              --format='%(refname:short)' \
              refs/tags \
              | grep -Fxv "$TAG" \
              | head -n 1 \
              || true
          )"

          if [ -n "$PREV_TAG" ]; then
            echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
            echo "Previous release tag: $PREV_TAG"
          else
            echo "PREV_TAG=" >> "$GITHUB_ENV"
            echo "No previous release tag found."
          fi

      - name: Generate CHANGELOG.md from previous release to HEAD
        shell: bash
        run: |
          set -e

          if [ -n "${PREV_TAG}" ]; then
            echo "Generating changelog from ${PREV_TAG}..HEAD"
            git-cliff --config cliff.toml "${PREV_TAG}..HEAD" --output CHANGELOG.md
          else
            echo "Generating changelog from full history"
            git-cliff --config cliff.toml --output CHANGELOG.md
          fi

          test -s CHANGELOG.md
          echo "---- CHANGELOG.md ----"
          head -n 120 CHANGELOG.md
          echo "----------------------"

      - name: Commit and push CHANGELOG.md if changed
        shell: bash
        run: |
          set -e

          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog changes."
          else
            git config user.name "changelog-bot"
            git config user.email "changelog-bot@users.noreply.local"

            git add CHANGELOG.md
            git commit -m "docs(changelog): update changelog [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare release notes
        shell: bash
        run: |
          set -e
          cp CHANGELOG.md RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          echo "---- RELEASE_NOTES.md ----"
          head -n 120 RELEASE_NOTES.md
          echo "--------------------------"

      - name: Derive semver package version from tag
        shell: bash
        run: |
          set -e

          PACKAGE_VERSION="$(echo "$TAG" | sed -E 's/^v([0-9]{2})\.0?([0-9]{1,2})\.0?([0-9]{1,2})\.?([a-z])$/\1.\2.\3-\4/')"

          if [ -z "$PACKAGE_VERSION" ]; then
            echo "❌ Failed to derive PACKAGE_VERSION from TAG=$TAG"
            exit 1
          fi

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Using package version: $PACKAGE_VERSION"

      - name: Generate version file for Astro footer
        shell: bash
        run: |
          set -e
          mkdir -p src/generated
          cat > src/generated/version.json <<EOF
          {
            "version": "${TAG}",
            "url": "${RELEASE_URL}"
          }
          EOF

          echo "Generated src/generated/version.json"
          cat src/generated/version.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Node version
        shell: bash
        run: |
          node -v
          npm -v

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          npm ci

      - name: Update package.json and package-lock.json version
        shell: bash
        run: |
          set -e
          npm version "$PACKAGE_VERSION" --no-git-tag-version

          echo "package.json version:"
          node -p "require('./package.json').version"

          echo "package-lock.json version:"
          node -p "require('./package-lock.json').version"

      - name: Commit and push version bump
        shell: bash
        run: |
          set -e

          if git diff --quiet -- package.json package-lock.json; then
            echo "No version changes to commit."
          else
            git config user.name "release-bot"
            git config user.email "release-bot@users.noreply.local"

            git add package.json package-lock.json
            git commit -m "chore(release): bump version to ${PACKAGE_VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build Astro site
        shell: bash
        run: |
          set -e
          npm run build
          test -d dist

      - name: Create export zip (Computing:Box Website.zip)
        shell: bash
        run: |
          set -e
          if [ ! -d "dist" ]; then
            echo "❌ dist/ folder not found in repo root"
            ls -la
            exit 1
          fi

          rm -f "Computing:Box Website.zip"
          (cd dist && zip -r "../Computing:Box Website.zip" .)
          test -s "Computing:Box Website.zip"
          ls -lh "Computing:Box Website.zip"

      - name: Create and push tag to GitHub
        shell: bash
        run: |
          set -e
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

      - name: Push tag to Forgejo
        shell: bash
        env:
          FORGEJO_URL: ${{ secrets.FORGEJO_URL }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -e
          if [ -z "$FORGEJO_URL" ] || [ -z "$FORGEJO_TOKEN" ]; then
            echo "⚠️ Forgejo secrets not configured. Skipping Forgejo tag push."
            exit 0
          }

          forgejo_host="${FORGEJO_URL#*://}"
          repo_slug="alexander.lyall/Computing-Box"
          
          echo "Pushing tag $TAG to Forgejo..."
          git remote add forgejo "https://oauth2:${FORGEJO_TOKEN}@${forgejo_host}/${repo_slug}.git"
          git push forgejo "refs/tags/$TAG" --force

      - name: Create GitHub release + upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create "$TAG" "${ZIP_PATH}#Computing:Box Website.zip" \
            --title "$RELEASE_NAME" \
            --notes-file RELEASE_NOTES.md \
            --target main

          echo "✅ GitHub Release created: ${RELEASE_NAME}"

      - name: Create Forgejo release + upload asset
        shell: bash
        env:
          FORGEJO_URL: ${{ secrets.FORGEJO_URL }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -e
          if [ -z "$FORGEJO_URL" ] || [ -z "$FORGEJO_TOKEN" ]; then
            echo "⚠️ Forgejo secrets not configured. Skipping Forgejo release mirror."
            exit 0
          fi

          echo "Creating release on Forgejo at ${FORGEJO_URL}..."

          python3 - <<'PY'
          import os, json, urllib.request, urllib.error

          forgejo_url = os.environ["FORGEJO_URL"].rstrip("/")
          token = os.environ["FORGEJO_TOKEN"]
          tag = os.environ["TAG"]
          name = os.environ["RELEASE_NAME"]
          zip_path = os.environ["ZIP_PATH"]

          with open("RELEASE_NOTES.md", "r", encoding="utf-8") as f:
              body = f.read()

          release_payload = json.dumps({
              "tag_name": tag,
              "target_commitish": "main",
              "name": name,
              "body": body,
              "draft": False,
              "prerelease": False
          }).encode("utf-8")

          repo_slug = "alexander.lyall/Computing-Box"
          api_url = f"{forgejo_url}/api/v1/repos/{repo_slug}/releases"

          req = urllib.request.Request(
              api_url,
              data=release_payload,
              headers={
                  "Authorization": f"token {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  release_data = json.loads(resp.read().decode("utf-8"))
                  release_id = release_data["id"]
                  print(f"✅ Created Forgejo release ID: {release_id}")
          except urllib.error.HTTPError as e:
              error_body = e.read().decode("utf-8", errors="ignore")
              print(f"❌ Failed to create Forgejo release (HTTP {e.code}): {error_body}")
              raise

          asset_url = f"{forgejo_url}/api/v1/repos/{repo_slug}/releases/{release_id}/assets?name=Computing%3ABox%20Website.zip"

          with open(zip_path, "rb") as f:
              zip_data = f.read()

          boundary = "----WebKitFormBoundary7MA4YWxkTrZu0gW"
          body_data = (
              f"--{boundary}\r\n"
              f'Content-Disposition: form-data; name="attachment"; filename="Computing:Box Website.zip"\r\n'
              f"Content-Type: application/zip\r\n\r\n"
          ).encode("utf-8") + zip_data + f"\r\n--{boundary}--\r\n".encode("utf-8")

          asset_req = urllib.request.Request(
              asset_url,
              data=body_data,
              headers={
                  "Authorization": f"token {token}",
                  "Content-Type": f"multipart/form-data; boundary={boundary}"
              },
              method="POST"
          )

          with urllib.request.urlopen(asset_req) as resp:
              print("✅ Successfully uploaded asset to Forgejo release")
          PY